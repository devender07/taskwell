name: tether

services:
  postgres:
    image: postgres:18-alpine
    container_name: tether-postgres
    environment:
      POSTGRES_USER: tether
      POSTGRES_PASSWORD: tether
      POSTGRES_DB: tether
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tether-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tether -d tether"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: tether-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # AI test runs in dev (docker compose --profile ai up -d chrome): the tester runs on the host with go run and
  # listens on :3128, and Chrome sends every request through it. Unlike production this Chrome isn't on an internal
  # network (it couldn't reach the host or publish its port), so the proxy flag is the only fence.
  chrome:
    profiles: ["ai"]
    image: chromedp/headless-shell:156.0.8078.48
    container_name: tether-chrome
    shm_size: 1gb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --proxy-server=http://host.docker.internal:3128
      - --proxy-bypass-list=<-loopback>
      - --force-webrtc-ip-handling-policy=disable_non_proxied_udp
      - --disable-background-networking
      - --disable-component-update
      - --disable-sync
      - --disable-default-apps
      - --disable-domain-reliability
      - --no-pings
      - --disable-features=AutofillServerCommunication,OptimizationHints,MediaRouter,Translate
    ports:
      - "127.0.0.1:9222:9222"

volumes:
  tether-pgdata:
    name: tether-pgdata
