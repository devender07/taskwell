# Standalone Postgres for Taskwell on its own server (or next to the app), tuned for 4 vCPU / 4 GB RAM.
# Installed to /opt/taskwell-db by deploy/server-setup.sh (deploy/README.md).
name: taskwell-db

services:
  postgres:
    image: postgres:18-alpine
    container_name: taskwell-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskwell
      POSTGRES_DB: taskwell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    # About 1-1.3 GB of RAM in use; halve the memory settings for a 2 GB server.
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=2560MB
      -c work_mem=8MB
      -c maintenance_work_mem=256MB
      -c max_connections=60
      -c wal_compression=on
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_worker_processes=4
      -c max_parallel_workers=4
      -c max_parallel_workers_per_gather=2
      -c idle_in_transaction_session_timeout=5min
      -c log_min_duration_statement=500ms
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432" # this server only; never open 5432 to the internet
    networks: [taskwell]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskwell -d taskwell"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  taskwell:
    name: taskwell # app containers join this network and reach the database as taskwell-postgres:5432

volumes:
  pgdata:
