# Production stack: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: tether-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tether}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Release step: applies the migrations and exits; the services start once it has succeeded.
  migrate:
    build: { context: .., dockerfile: deploy/backend.Dockerfile, args: { SVC: user } }
    image: tether-user
    command: ["-migrate"]
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-tether}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tether}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      MIGRATE_LOCK_TIMEOUT: ${MIGRATE_LOCK_TIMEOUT:-10s}
      LOG_FORMAT: ${LOG_FORMAT:-json}

  user:
    build: { context: .., dockerfile: deploy/backend.Dockerfile, args: { SVC: user } }
    image: tether-user
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # /readyz on the internal METRICS_ADDR: the database answers and both listeners are up. The image has no curl.
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      PORT: "8090"
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-tether}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tether}?sslmode=disable
      MIGRATE_ON_START: "false"
      METRICS_ADDR: ${METRICS_ADDR:-127.0.0.1:9090}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SWEEP_INTERVAL: ${SWEEP_INTERVAL:-24h}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-30s}
      DB_IDLE_TX_TIMEOUT: ${DB_IDLE_TX_TIMEOUT:-2min}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      UPLOAD_DIR: /data/uploads
      NOTIFY_INTERVAL: ${NOTIFY_INTERVAL:-1m}
      NOTIFY_SETTLE: ${NOTIFY_SETTLE:-30s}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-20s}
      MAIL_RETRY_BASE: ${MAIL_RETRY_BASE:-30s}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-8}
    volumes:
      - uploads:/data/uploads

  admin:
    build: { context: .., dockerfile: deploy/backend.Dockerfile, args: { SVC: admin } }
    image: tether-admin
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on: { migrate: { condition: service_completed_successfully } } # it refuses an old schema
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      PORT: "8080"
      METRICS_ADDR: ${ADMIN_METRICS_ADDR:-127.0.0.1:9091}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-tether}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tether}?sslmode=disable
      DB_MAX_CONNS: ${ADMIN_DB_MAX_CONNS:-5}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-30s}
      DB_IDLE_TX_TIMEOUT: ${DB_IDLE_TX_TIMEOUT:-2min}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?set ADMIN_JWT_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}

  caddy:
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    image: tether-web
    restart: unless-stopped
    depends_on:
      user: { condition: service_healthy }
      admin: { condition: service_healthy }
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST}
      ADMIN_HOST: ${ADMIN_HOST:?set ADMIN_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  uploads:
  caddy-data:
  caddy-config:
