name: ci

on:
  push:
    branches: [master, development]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: taskwell, POSTGRES_PASSWORD: taskwell, POSTGRES_DB: taskwell_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskwell" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      # The model packages' integration tests migrate it and clean up after themselves (internal/dbtest).
      TEST_DATABASE_URL: postgres://taskwell:taskwell@localhost:5432/taskwell_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.work, cache-dependency-path: backend/*/go.sum }
      - run: go vet github.com/devender07/taskwell/backend/admin/... github.com/devender07/taskwell/backend/user/... github.com/devender07/taskwell/backend/shared/... github.com/devender07/taskwell/backend/mcp/...
      # The S3 store the s3_* defaults point at (as in docker-compose.yml), for the storage and upload tests.
      - run: |
          docker run -d --name s3 -p 9000:8333 chrislusf/seaweedfs:3.97 server -dir=/data -s3 -ip.bind=0.0.0.0
          curl -sf --retry 60 --retry-all-errors --retry-delay 1 http://localhost:9000/healthz
          echo 's3.bucket.create -name taskwell' | docker exec -i s3 weed shell -master=localhost:9333
      # A fresh database: migrate it first, since the admin and mail tests use the schema without migrating it.
      - run: DATABASE_URL=$TEST_DATABASE_URL go run ./user/cmd/user -migrate
      - run: go test -race github.com/devender07/taskwell/backend/admin/... github.com/devender07/taskwell/backend/user/... github.com/devender07/taskwell/backend/shared/... github.com/devender07/taskwell/backend/mcp/...
      # Built with the toolchain go.work selects (else it can't type-check that stdlib); it only takes per-module patterns.
      - run: GOTOOLCHAIN=$(go env GOVERSION) go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: for m in admin user mcp shared; do (cd $m && govulncheck ./...) || exit 1; done

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm audit --omit=dev

