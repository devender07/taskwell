name: ci

on:
  push:
    branches: [master, development]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: tether, POSTGRES_PASSWORD: tether, POSTGRES_DB: tether_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tether" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      # The model packages' integration tests migrate it and clean up after themselves (internal/dbtest).
      TEST_DATABASE_URL: postgres://tether:tether@localhost:5432/tether_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.work, cache-dependency-path: backend/*/go.sum }
      - run: go vet github.com/devender07/tether/backend/admin/... github.com/devender07/tether/backend/user/...
      - run: go test -race github.com/devender07/tether/backend/admin/... github.com/devender07/tether/backend/user/...
      # Built with the toolchain go.work selects (else it can't type-check that stdlib); it only takes per-module patterns.
      - run: GOTOOLCHAIN=$(go env GOVERSION) go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: cd admin && govulncheck ./... && cd ../user && govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm audit --omit=dev

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/backend.Dockerfile --build-arg SVC=user .
      - run: docker build -f deploy/backend.Dockerfile --build-arg SVC=admin .
      - run: docker build -f deploy/web.Dockerfile .
